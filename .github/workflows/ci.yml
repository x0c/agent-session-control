name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (py${{ matrix.python }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Minimum, recommended, and maximum supported interpreters.
        python: ["3.10", "3.12", "3.14"]
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned 2026-07-16 (actions/checkout v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned 2025-04-24 (actions/setup-python v5).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Pinned 2025-09-30 (astral-sh/setup-uv v6).
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install tmux (per-OS backend dependency)
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then command -v tmux >/dev/null 2>&1 || brew install tmux; else command -v tmux >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y tmux; }; fi
          tmux -V
      - name: Sync dev environment (all extras)
        # history/acp extras are required: the gate imports sesskit/acp.
        run: uv sync --group dev --all-extras
      - name: Repository gate, CI mode (Ruff, Pyrefly, pytest -m "not live", packaging, clean installs)
        # Default local `scripts/check.py` stays FULL (incl. live); CI uses
        # the explicit no-credential selection so no-credential CI never
        # spends quota. Live coverage is manual-only (see `live` job).
        run: uv run --group dev scripts/check.py --ci
      - name: No-credential test selection stays green on its own
        # Default CI never spends quota or needs logins; `live` is opt-in only.
        run: uv run --group dev python -m pytest -W error -q -m "not live" tests
      - name: Example plans + CLI envelopes (offline)
        run: uv run --group dev python examples/basic_control.py --cwd ${{ runner.temp }}/asc-ci-proj
      - name: Bounded smoke, engine legs only (no stdio, no model)
        run: uv run --group dev python examples/native_smoke.py --skip-stdio

  metadata:
    name: wheel/sdist metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Sync dev environment (all extras)
        run: uv sync --group dev --all-extras
      - name: Distribution tests
        run: uv run --group dev python -m pytest -W error -q -m "not live" tests/test_distribution.py tests/test_core_imports.py

  live:
    name: live native/model (manual, never on forks)
    # Authenticated, quota-spending coverage. Never runs in default CI or on forks:
    # explicit manual dispatch on the canonical repository only.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'x0c/agent-session-control'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install tmux (per-OS backend dependency)
        run: |
          command -v tmux >/dev/null 2>&1 || brew install tmux
          tmux -V
      - name: Sync dev environment (all extras)
        run: uv sync --group dev --all-extras
      - name: Live-marked tests (requires logins/quota in secrets)
        run: uv run --group dev python -m pytest -W error -q -m live tests
